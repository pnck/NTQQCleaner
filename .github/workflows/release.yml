# release.yml — 语义 tag → 正式 release
#
# 触发：
#   - push tag vX.Y.Z（精确匹配 v<major>.<minor>.<patch>；preview workflow
#     的 alpha 标签由 gh 在服务端创建，不经 push 事件，不会误触发本文件）
#   - workflow_dispatch（tag 输入）：tag push 不会因 workflow 文件修改而
#     重触发，构建失败修好 workflow 后用 dispatch 补发同一个 tag
#
# 内容：完整门禁（gofmt + go test + smoke + vet + tsc），仅编译 release
# bundle（4 平台矩阵，每平台各自的 runner 类型），发布正式 release。
# 正式 release 永不删除（保留策略只在 preview.yml 里）。
#
# 前端只构建一次：dist 平台无关（各 GUI 目标 embed 同一份），在 gate
# 构建并作为 artifact 传给矩阵单元——单元不装 node/pnpm，Taskfile 的
# frontend 任务检测到 dist 即跳过（status: test -f dist/index.html）。
#
# 矩阵（runner 按平台能力分型）：
#   windows-amd64 → ubuntu-24.04（交叉；后端纯 Go，容器已验证。windows
#     runner 与 Taskfile 的 unix 方言 sh: 变量不兼容，实测 task 求值
#     `go env GOOS` 直接 127）
#   darwin-arm64  → macos-15（arm64）
#   darwin-amd64 → macos-15-intel（macos-13 已退役，x64 专用标签）
#   linux-amd64   → ubuntu-24.04（apt 装 webkit2gtk 4.1 dev；Taskfile 已
#                   内联 webkit2_41 tag）
# 矩阵产物为 GitHub Actions artifacts（仅传输用，1 天过期防 quota 打满），
# 发布物以 release assets 形式持久保留。

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.2; only needed for re-runs after a failed tag push)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # 完整门禁：所有平台构建都必须在测试与 lint 全绿之后才开始。
  # 顺带构建前端 dist（唯一一次）：矩阵单元只下载、不重建。
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # setup-go 无条件经 GITHUB_ENV 导出 GOTOOLCHAIN=local（覆盖 job 级
      # env）——task v3.52.0 需要 go >= 1.25.10 而 go.mod 只声明 1.25.0：
      # 重新导出 auto，go install 按需自动下载更高工具链。项目自身已用
      # 精确 1.25.0 工具链实测 build+test 通过，不会触发切换。
      - name: Allow toolchain auto-switching
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: pnpm/setup@v2.0.2
        with:
          # packageManager 在 frontend/package.json（pnpm@11.21.0）；仓库
          # 根目录没有 package.json，默认探测会报 No pnpm version specified
          package-json-file: frontend/package.json
          install: false
      - name: Install task CLI
        env:
          GOBIN: ${{ github.workspace }}/.tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          echo "${{ github.workspace }}/.tools" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "$out"; echo "::error::gofmt found unformatted files"; exit 1; fi
      - name: Go test + smoke + vet
        run: task verify
      - name: Frontend typecheck
        run: task frontend:typecheck
      - name: Build frontend dist
        run: task frontend
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          # 纯传输用，1 天过期
          retention-days: 1

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            os: ubuntu-24.04
          - target: darwin-arm64
            os: macos-15
          - target: darwin-amd64
            os: macos-15-intel
          - target: linux-amd64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Linux system deps (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # 同 gate：覆盖 setup-go 的 GOTOOLCHAIN=local，让 go install 按需切换
      - name: Allow toolchain auto-switching
        shell: bash
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Install task + wails CLI
        shell: bash
        env:
          GOBIN: ${{ github.workspace }}/.tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          # wails CLI 版本必须与 go.mod 一致（CLAUDE.md「容器环境」）
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          echo "${{ github.workspace }}/.tools" >> "$GITHUB_PATH"
      - name: Download frontend dist (built once in gate)
        uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-dist
          # upload-artifact 以给定 path 为根存储（artifact 内无
          # frontend/dist 前缀）：解包到 frontend/dist，匹配 Taskfile
          # frontend 任务的 status 检查（test -f dist/index.html）
          path: frontend/dist
      - name: Verify frontend dist layout
        shell: bash
        run: test -f frontend/dist/index.html
      - name: Bundle (release, official asset)
        shell: bash
        run: |
          task "bundle:${{ matrix.target }}:release"
          mkdir -p release
          case "${{ matrix.target }}" in
            darwin-*)
              # .app 是目录，发布为 zip（ditto 保留符号链接与资源叉）
              ditto -c -k --keepParent "build/bin/ntqq-cleaner.app" "release/ntqq-cleaner-${{ matrix.target }}.zip"
              ;;
            windows-*)
              mv "build/bin/ntqq-cleaner.exe" "release/ntqq-cleaner-${{ matrix.target }}.exe"
              ;;
            linux-*)
              mv "build/bin/ntqq-cleaner" "release/ntqq-cleaner-${{ matrix.target }}"
              ;;
          esac
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: artifacts-${{ matrix.target }}
          path: release/
          if-no-files-found: error
          # 纯传输用，1 天过期（发布物持久保留在 release assets）
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # 完整历史 + tags：changelog 需要上一语义 tag
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: assets
      - name: Publish official release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # changelog：上一语义 tag 以来的提交。grep 锚定整串（git tag -l
          # 的 fnmatch glob 中 [0-9]* 会连 -alpha 后缀一起吞掉）
          PREV="$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | grep -v "^${TAG}$" | tail -1)"
          if [ -n "$PREV" ]; then
            NOTES="$(git log "${PREV}..${TAG}" --pretty=format:'- %s')"
          else
            NOTES="$(git log -n 50 --pretty=format:'- %s' "${TAG}")"
          fi
          # 补发重跑（dispatch）时 release 可能已存在：改为补传 assets
          # （资产名与下载的文件名一致，不需要 gh 的 file#displayName 语法）
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "$TAG" --notes "$NOTES"
          fi
