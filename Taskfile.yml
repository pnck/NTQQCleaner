# ntqq-cleaner 构建目标（https://taskfile.dev）
#
# 三层模型（= 真实构建步骤的三种不同组合）：
#   前端产物   frontend / frontend:install / frontend:typecheck
#   二进制层   build-cli（纯 CLI）· build 族（裸 go build：快速验证/容器交叉）
#   打包层     bundle 族（wails build：manifest/图标/版本资源，正式分发）
#   开发       dev（wails dev 热重载，宿主）
#   验证       verify（CI 门禁 = test+smoke+vet）· test / smoke / vet / fmt
#   清理       clean
#
# 命名规则（动词优先，维度固定顺序）：
#   <动词>[:<平台>-<架构>][:<模式>]
#   - 平台 token 必含 -<架构>（windows-amd64 / darwin-arm64 / darwin-amd64 /
#     linux-amd64），省略 = 宿主；模式 token 显式 debug | release，
#     完全对称（debug = 开 inspector、不 strip；release = -s -w +
#     trimpath、无 debug 注入）。
#   - 省略模式的默认值：build/bundle 全族统一 = dev（宿主与平台变体
#     一致，无「mac dev / windows release」的意外落差）。release 一律
#     显式 :release（CI 矩阵调用 bundle:<os>-<arch>:release）。
#   - 产物变体用 - 后缀：build-cli；release 二进制名追加 -release 后缀
#     （与 dev 二进制并存，不互相覆盖）。
#   - 例：build:windows-amd64:debug、build:windows-amd64:release、
#     bundle:windows-amd64（默认 release）、bundle:windows-amd64:debug
#
# 平台变体的实现方式：Taskfile 没有 glob 任务名（task build:* 不成立），
# 标准等价写法 = internal 参数化实现（build:p / bundle:p，不出现在
# --list）+ 每个平台一个薄别名转发。CI 按矩阵单元直接调用子目标：
#   task bundle:<os>-<arch>    （矩阵单元 {OS,ARCH} → 名字的确定性映射）
# darwin 只能在 macOS runner 构建；linux 需 webkit2gtk。矩阵本身是 CI
# runner 的职责，这里只提供子目标，不做本机全平台目标。
#
# 环境变量全部内联在 task 的 env: 里（无需每次命令行传 CGO_ENABLED=）；
# GO 路径自动探测（PATH 里第一个 go；可用 GO=/opt/go/bin/go task xxx 覆盖）。
#
# 交叉编译现实（wails v2.14，已实测）：
#   - Windows 后端纯 Go（WebView2 via syscall）→ 任意主机可交叉，产物真实可用
#   - macOS 后端 ObjC/cgo（WKWebView）→ 需要 Xcode 工具链，必须在 Mac / macos CI 上构建
#   - Linux 后端 webkit2gtk + cgo → 需要桌面环境与系统库
#   - 裸 go build 必须带 production 标签：缺失会编入 Wails 的 stub
#     （运行时报 "Wails applications will not build without the correct build tags"）

version: "3"

vars:
  GO:
    sh: command -v go
  PNPM:
    sh: command -v pnpm
  GOOS:
    sh: '{{.GO}} env GOOS'
  HOST_ARCH:
    sh: '{{.GO}} env GOARCH'
  APP: ntqq-cleaner
  BINDIR: build/bin
  LDFLAGS: "-s -w"
  TAGS: wails,production
  # dev（省略 = dev）模式的附加参数：debug/devtools 是 wails v2 的两个
  # 独立 build tag（app_debug.go / app_devtools.go）——debug 开调试日志、
  # devtools 开 inspector（Windows WebView2 PutAreDevToolsEnabled + F12）。
  # LDFLAGS_DEV 的 -X 注入在 Windows 上同样生效：wails windows 前端在
  # debug + OpenInspectorOnStartup 时启动自动打开 devtools（frontend.go）。
  TAGS_DEV: "{{.TAGS}},debug,devtools"
  LDFLAGS_DEV: -X main.openInspectorOnStartup=1
  GCFLAGS_DEV: "all=-N -l"
  # Wails 2.14 darwin 端使用 UTType 但未链接 UniformTypeIdentifiers framework
  # （macOS 11+，已知上游未修）——macOS 构建必须补这个 framework。
  DARWIN_EXTRA_LDFLAGS: -framework UniformTypeIdentifiers
  # 宿主打包平台（bundle / bundle:release 的平台省略段）。
  BUNDLE_PLATFORM:
    sh: 'echo {{.GOOS}}/$(uname -m | sed "s/x86_64/amd64/;s/aarch64/arm64/")'

tasks:
  # ==================== 前端产物（所有 GUI 构建的前置） ====================

  frontend:
    desc: 构建内嵌前端 dist/（容器构建好即可，Mac 构建时直接复用；源码变更后 task frontend --force）
    cmds:
      # --config.verify-deps-before-run=warn：pnpm 11 从 workspace 成员目录
      # 跑命令时不读根 pnpm-workspace.yaml 的 allowBuilds，deps 状态检查会
      # 误报 ERR_PNPM_IGNORED_BUILDS（esbuild 经 optionalDependencies 无需
      # postinstall，可正常工作）。旧版 pnpm 同样支持 --config. 语法。
      - '{{.PNPM}} --config.verify-deps-before-run=warn --dir frontend build'
    status:
      - test -f frontend/dist/index.html

  frontend:install:
    desc: 安装前端依赖（开发前端时才需要，一次性）
    cmds:
      - '{{.PNPM}} --config.verify-deps-before-run=warn --dir frontend install'

  frontend:typecheck:
    desc: 前端类型检查（tsc --noEmit）
    cmds:
      - '{{.PNPM}} --config.verify-deps-before-run=warn --dir frontend typecheck'

  # ==================== 二进制层：裸 go build（快速验证 / 容器交叉） ====================

  build-cli:
    desc: 纯 CLI 二进制（无 GUI 依赖，任何环境可构建）
    cmds:
      - '{{.GO}} build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BINDIR}}/{{.APP}}-cli .'

  # 平台变体的参数化实现（internal：不出现在 --list，经下方别名调用）。
  # PLATFORM 省略 = native（宿主）；RELEASE=1 = release。平台差异
  # （CGO/-H windowsgui/输出名）都在这一处按 token 条件化。
  # dev（默认）：debug+devtools 标签开 inspector、gcflags 关优化、不 strip
  #   （产物名无后缀）；
  # release：production 标签 + -s -w strip + trimpath（产物名 -release 后缀，
  #   与 dev 并存）。
  build:p:
    internal: true
    vars:
      PLATFORM: '{{default "native" .PLATFORM}}'
      RELEASE: '{{default "0" .RELEASE}}'
      OS: '{{if eq .PLATFORM "native"}}{{.GOOS}}{{else}}{{index (splitList "-" .PLATFORM) 0}}{{end}}'
      ARCH: '{{if eq .PLATFORM "native"}}{{.HOST_ARCH}}{{else}}{{index (splitList "-" .PLATFORM) 1}}{{end}}'
    deps: [frontend]
    cmds:
      - '{{.GO}} build -tags {{if eq .RELEASE "0"}}{{.TAGS_DEV}}{{else}}{{.TAGS}}{{end}} {{if eq .RELEASE "0"}}-gcflags "{{.GCFLAGS_DEV}}"{{end}} {{if eq .RELEASE "1"}}-trimpath{{end}} -ldflags "{{if eq .RELEASE "0"}}{{.LDFLAGS_DEV}}{{else}}{{.LDFLAGS}}{{end}}{{if eq .OS "windows"}} -H windowsgui{{end}}" -o {{.BINDIR}}/{{.APP}}{{if ne .PLATFORM "native"}}-{{.PLATFORM}}{{end}}{{if eq .RELEASE "1"}}-release{{end}}{{if eq .OS "windows"}}.exe{{end}} .'
    env:
      CGO_ENABLED: '{{if eq .OS "windows"}}0{{else}}1{{end}}'
      GOOS: '{{.OS}}'
      GOARCH: '{{.ARCH}}'
      CGO_LDFLAGS: '{{if eq .OS "darwin"}}{{.DARWIN_EXTRA_LDFLAGS}}{{end}}'

  build:
    desc: 宿主原生 GUI 二进制（go build 层，省略 = dev：开 inspector、不 strip）
    cmds:
      - task: build:p

  build:debug:
    desc: 宿主原生 GUI 二进制，显式 debug 模式（与省略默认等价）
    cmds:
      - task: build:p

  build:release:
    desc: 宿主 release GUI 二进制（go build 层：-s -w + trimpath，无 debug 注入）
    cmds:
      - task: build:p
        vars: {RELEASE: "1"}

  build:windows-amd64:
    desc: Windows GUI 二进制 dev 模式（go build 层，任意主机交叉；debug/devtools 标签开 inspector。release 见 build:windows-amd64:release）
    cmds:
      - task: build:p
        vars: {PLATFORM: windows-amd64}

  build:windows-amd64:debug:
    desc: Windows GUI 二进制，显式 debug 模式（与省略默认等价）
    cmds:
      - task: build:p
        vars: {PLATFORM: windows-amd64}

  build:windows-amd64:release:
    desc: Windows release GUI 二进制（go build 层，-s -w + trimpath；正式分发走 bundle:windows-amd64）
    cmds:
      - task: build:p
        vars: {PLATFORM: windows-amd64, RELEASE: "1"}

  build:darwin-arm64:
    desc: macOS arm64 GUI 二进制 dev 模式（go build 层，只能在 macOS 主机上构建；开 inspector）
    cmds:
      - task: build:p
        vars: {PLATFORM: darwin-arm64}

  build:darwin-arm64:debug:
    desc: macOS arm64 GUI 二进制，显式 debug 模式（与省略默认等价）
    cmds:
      - task: build:p
        vars: {PLATFORM: darwin-arm64}

  build:darwin-arm64:release:
    desc: macOS arm64 release GUI 二进制（go build 层，只能在 macOS 主机上构建）
    cmds:
      - task: build:p
        vars: {PLATFORM: darwin-arm64, RELEASE: "1"}

  build:darwin-amd64:
    desc: macOS amd64 GUI 二进制 dev 模式（go build 层，只能在 macOS 主机上构建；开 inspector）
    cmds:
      - task: build:p
        vars: {PLATFORM: darwin-amd64}

  build:darwin-amd64:debug:
    desc: macOS amd64 GUI 二进制，显式 debug 模式（与省略默认等价）
    cmds:
      - task: build:p
        vars: {PLATFORM: darwin-amd64}

  build:darwin-amd64:release:
    desc: macOS amd64 release GUI 二进制（go build 层，只能在 macOS 主机上构建）
    cmds:
      - task: build:p
        vars: {PLATFORM: darwin-amd64, RELEASE: "1"}

  build:linux-amd64:
    desc: Linux GUI 二进制 dev 模式（go build 层，需 webkit2gtk；未实测——开发容器无此依赖）
    cmds:
      - task: build:p
        vars: {PLATFORM: linux-amd64}

  build:linux-amd64:debug:
    desc: Linux GUI 二进制，显式 debug 模式（与省略默认等价）
    cmds:
      - task: build:p
        vars: {PLATFORM: linux-amd64}

  build:linux-amd64:release:
    desc: Linux release GUI 二进制（go build 层，需 webkit2gtk；未实测）
    cmds:
      - task: build:p
        vars: {PLATFORM: linux-amd64, RELEASE: "1"}

  # ==================== 开发（宿主热重载） ====================

  dev:
    desc: wails dev 热重载（需 wails CLI 与桌面环境）
    cmds:
      - wails dev -tags wails
    env:
      CGO_LDFLAGS: "{{.DARWIN_EXTRA_LDFLAGS}}"

  # ==================== 打包层：wails build（正式分发 / CI 子目标） ====================

  # 打包的参数化实现。PLATFORM 省略 = 宿主（BUNDLE_PLATFORM 推断）；
  # RELEASE=1 = release；dev 模式仅宿主。
  # dev：wails build -debug（Mode Debug：自动加 production,debug,devtools
  #   标签、gcflags all=-N -l、buildvcs=false）——Windows 自动打开
  #   WebView2 devtools / macOS 经 -X 注入自动打开 WebKit inspector；
  #   不 strip（保留符号）。
  # release：production 标签 + -s -w strip + trimpath，无任何 debug 注入。
  # darwin 的 framework 链接由 darwin 别名/宿主任务携带（wails 透传 env）。
  bundle:p:
    internal: true
    vars:
      PLATFORM: '{{default "native" .PLATFORM}}'
      RELEASE: '{{default "0" .RELEASE}}'
    deps: [frontend]
    cmds:
      - 'wails build -platform {{if eq .PLATFORM "native"}}{{.BUNDLE_PLATFORM}}{{else}}{{replace "-" "/" .PLATFORM}}{{end}} -clean -s -tags wails {{if eq .RELEASE "0"}}-debug{{end}} -trimpath -ldflags "{{if eq .RELEASE "0"}}{{.LDFLAGS_DEV}}{{else}}{{.LDFLAGS}}{{end}}"'

  bundle:
    desc: 宿主 dev .app 包（-debug：开 inspector、不 strip）；release 见 bundle:release
    cmds:
      - task: bundle:p
    env:
      CGO_LDFLAGS: "{{.DARWIN_EXTRA_LDFLAGS}}"

  bundle:debug:
    desc: 宿主 dev .app 包，显式 debug 模式（与省略默认等价）
    cmds:
      - task: bundle:p
    env:
      CGO_LDFLAGS: "{{.DARWIN_EXTRA_LDFLAGS}}"

  bundle:release:
    desc: 宿主 release 包（wails build，无 debug 标签、不自动开 inspector）
    cmds:
      - task: bundle:p
        vars: {RELEASE: "1"}
    env:
      CGO_LDFLAGS: "{{.DARWIN_EXTRA_LDFLAGS}}"

  bundle:windows-amd64:
    desc: Windows dev 包（wails build：manifest/图标/版本资源齐全，-debug 开 inspector；需 wails CLI，任意主机。release 见 bundle:windows-amd64:release）
    cmds:
      - task: bundle:p
        vars: {PLATFORM: windows-amd64}

  bundle:windows-amd64:debug:
    desc: Windows dev 包（-debug：开 inspector、不 strip；需 wails CLI，任意主机）
    cmds:
      - task: bundle:p
        vars: {PLATFORM: windows-amd64}

  bundle:darwin-arm64:
    desc: macOS arm64 dev 包（-debug 开 inspector；只能在 macOS 主机上构建。release 见 bundle:darwin-arm64:release）
    cmds:
      - task: bundle:p
        vars: {PLATFORM: darwin-arm64}
    env:
      CGO_LDFLAGS: "{{.DARWIN_EXTRA_LDFLAGS}}"

  bundle:darwin-arm64:debug:
    desc: macOS arm64 dev 包（-debug：开 inspector、不 strip；只能在 macOS 主机上构建）
    cmds:
      - task: bundle:p
        vars: {PLATFORM: darwin-arm64}
    env:
      CGO_LDFLAGS: "{{.DARWIN_EXTRA_LDFLAGS}}"

  bundle:darwin-amd64:
    desc: macOS amd64 dev 包（-debug 开 inspector；只能在 macOS 主机上构建。release 见 bundle:darwin-amd64:release）
    cmds:
      - task: bundle:p
        vars: {PLATFORM: darwin-amd64}
    env:
      CGO_LDFLAGS: "{{.DARWIN_EXTRA_LDFLAGS}}"

  bundle:darwin-amd64:debug:
    desc: macOS amd64 dev 包（-debug：开 inspector、不 strip；只能在 macOS 主机上构建）
    cmds:
      - task: bundle:p
        vars: {PLATFORM: darwin-amd64}
    env:
      CGO_LDFLAGS: "{{.DARWIN_EXTRA_LDFLAGS}}"

  bundle:linux-amd64:
    desc: Linux dev 包（-debug 开 inspector；需 webkit2gtk；未实测。release 见 bundle:linux-amd64:release）
    cmds:
      - task: bundle:p
        vars: {PLATFORM: linux-amd64}

  bundle:linux-amd64:debug:
    desc: Linux dev 包（-debug：开 inspector、不 strip；需 webkit2gtk；未实测）
    cmds:
      - task: bundle:p
        vars: {PLATFORM: linux-amd64}

  # ==================== 验证 ====================

  verify:
    desc: CI 门禁（test + smoke + vet；fmt 会改写文件，不并入）
    cmds:
      - task: test
      - task: smoke
      - task: vet

  test:
    desc: 全部 Go 测试
    cmds:
      - '{{.GO}} test ./...'

  smoke:
    desc: CLI 端到端冒烟（scan → manifest → clean 红线验证）
    cmds:
      - ./tests/cli_smoke.sh

  vet:
    desc: go vet
    cmds:
      - '{{.GO}} vet ./...'

  fmt:
    desc: gofmt 全部 Go 文件（会改写文件，不并入 verify）
    cmds:
      - '{{.GO}}fmt -l -w .'

  # ==================== 清理 ====================

  clean:
    desc: 删除构建产物
    cmds:
      - rm -rf build
